pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: ruff check {staged_files}
    ruff-format:
      glob: "*.py"
      run: ruff format --check {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x -e SC1091 {staged_files}
    pyright:
      glob: "plugins/xp-agents/{scripts,smm}/*.py"
      root: "plugins/xp-agents/"
      run: pyright
    tests-smm:
      run: python3 -m unittest discover -s plugins/xp-agents/tests/smm -p "test_*.py"
    tests-engine:
      run: python3 -m unittest discover -s plugins/xp-agents/tests/engine -p "test_*.py"
    tests-hooks:
      run: python3 -m unittest discover -s plugins/xp-agents/tests/hooks -p "test_*.py"
    tests-integration:
      run: python3 -m unittest discover -s plugins/xp-agents/tests/integration -p "test_*.py"

pre-push:
  parallel: true
  commands:
    integration:
      run: python3 -m unittest discover -s plugins/xp-agents/tests/integration -p "test_*.py"
