pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: ruff check {staged_files}
    ruff-format:
      glob: "*.py"
      run: ruff format --check {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    tests:
      run: python3 -m unittest smm/test_smm.py
    tests-engine:
      run: python3 -m unittest smm/test_engine.py
    tests-hooks:
      run: python3 -m unittest scripts/test_hooks.py
    tests-integration:
      run: python3 -m unittest scripts/test_integration.py

pre-push:
  parallel: true
  commands:
    integration:
      run: python3 -m unittest scripts/test_integration.py
