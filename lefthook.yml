pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "*.py"
      run: ruff check {staged_files}
    ruff-format:
      glob: "*.py"
      run: ruff format --check {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x -e SC1091 {staged_files}
    pyright:
      glob: "plugins/xp-agents/{scripts,smm}/*.py"
      root: "plugins/xp-agents/"
      run: pyright
    # All tests in one pytest -n auto run (~13s on 16 cores). Replaces four
    # separate unittest discover commands; pytest-xdist parallelism is finer-
    # grained than lefthook's per-command parallelism. See README "Development
    # setup" for pipx install + pytest-xdist injection.
    tests:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME pytest -n auto -q

pre-push:
  parallel: true
  commands:
    integration:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME pytest plugins/xp-agents/tests/integration -n auto -q
