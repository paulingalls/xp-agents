# piped (NOT parallel — lefthook rejects both): ruff-check --fix and ruff-format
# both rewrite staged files in place, so nothing else may read them
# concurrently. `priority: 1` and `2` pin the two rewriters ahead of every
# reader regardless of name ordering (verified against lefthook 2.1.10:
# priority orders piped and plain-sequential runs, and is a no-op under
# parallel); see test_lefthook_commit_gate.py::TestRewritersRunBeforeReaders.
#
# Two consequences of `piped` beyond the ordering, both deliberate:
#  - It ABORTS the remaining commands at the first failure, so a red commit
#    shows only the FIRST failing check, not every one at once as parallel did.
#  - Everything is sequential, pyright included.
#
# The commit gate is lint, format, types, and the test files you staged — the
# full suite moved to pre-push. It was measured at 432s (9188 tests) on this
# machine, which is 36x the ~12s the remaining commands cost and made every
# increment expensive enough to push toward batching several changes into one
# commit. Nothing is ungated:
# `git push` fires on every story close (xp-story-close Step 2) and again on the
# post-merge target push, so the suite runs on the story tip AND on the merged
# result — the latter is combination coverage a pre-commit hook never gave,
# since git runs no pre-commit for a merge at all.
#
# Accepted residual of `stage_fixed` (see the SMM's precommit-piped-priority /
# partial-stage decisions): on a PARTIALLY staged file, ruff formats the
# working-tree copy and stage_fixed `git add`s the whole file, so unstaged
# edits in that file join the commit. Stage whole files, or re-check `git diff
# --cached` after a commit where the formatter reported a rewrite.
pre-commit:
  piped: true
  commands:
    # Both rewriters run before anything that READS the files, and --fix comes
    # before format: ruff's own guidance, because a fix can leave code the
    # formatter still has to tidy. Reversed, a commit records unformatted
    # autofix output.
    ruff-check:
      glob: "*.py"
      priority: 1
      run: ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      priority: 2
      run: ruff format {staged_files}
      stage_fixed: true
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x -e SC1091 {staged_files}
    pyright:
      glob: "plugins/xp-agents/**/*.py"
      root: "plugins/xp-agents/"
      run: pyright
    # The tests you TOUCHED, never the suite — that is pre-push's job, and this
    # says nothing about the rest of the tree. Breaking the test you just wrote
    # is the one regression worth catching before the commit lands.
    #
    # The `-f`/`-d` guards and the empty bail are load-bearing. A staged file
    # that was DELETED still reaches {staged_files}, so pytest would fail
    # collection on a path that is gone; filtering fixes that but can leave the
    # list EMPTY, and `pytest` with no paths collects the WHOLE tree — silently
    # restoring the 432s gate this file removed. Hence: filter, then bail.
    #
    # `|| [ $? -eq 5 ]` tolerates pytest's "no tests collected". A directory
    # target that happens to contain none (a new package, or one emptied by a
    # rename) would otherwise exit 5, which lefthook reads as a failed commit —
    # the same refusal this command exists to stop.
    #
    # The glob is DELIBERATELY wide and the body does the selecting. Two
    # reasons, both learned the hard way:
    #
    #   * Shared fixtures must be covered. A broken conftest.py or _*.py
    #     helper fails thousands of tests while matching no test_* name, so
    #     it ran ZERO tests and committed green. They map to their containing
    #     DIRECTORY in the body — a file target collects nothing — and a
    #     directory target carries `-n auto`, because the tree sequentially
    #     is the 432s run this gate exists to remove while the same tree
    #     under xdist is seconds.
    #   * A narrower pattern would have to encode the shapes in glob syntax,
    #     and a form this engine does not support matches NOTHING — the gate
    #     would stop firing silently, which no test here can catch (they
    #     execute the body, bypassing the glob). A wide glob is only safe
    #     because the body classifies EVERY path it is handed.
    #
    # The classification is: `test_*.py` is a file target, and every OTHER
    # .py under the tests tree is a helper, so it selects its DIRECTORY. Not
    # just conftest.py and _*.py — a review caught tests/engine/
    # sister_test_base.py falling through an earlier catch-all into a bare
    # file target, where pytest collects nothing and exits 5 and lefthook
    # refuses the commit. That is the same defect this command fixes for
    # scripts/test_parsing.py, one directory over.
    #
    # The body's `plugins/xp-agents/tests/` prefix filter is what keeps this
    # off shipped code — `smm/_common.py`, and `scripts/test_parsing.py`,
    # production modules named like tests where pytest collects nothing and
    # exits 5, which lefthook reads as a failed commit.
    staged-tests:
      glob: "**/*.py"
      run: |
        files=""
        dirs=""
        for f in {staged_files}; do
          case "$f" in plugins/xp-agents/tests/*) ;; *) continue ;; esac
          case "${f##*/}" in
            test_*.py)
              [ -f "$f" ] && files="$files $f"
              ;;
            *.py)
              d="${f%/*}"
              [ -d "$d" ] || continue
              case " $dirs " in *" $d "*) ;; *) dirs="$dirs $d" ;; esac
              ;;
            *) continue ;;
          esac
        done
        keep=""
        for f in $files; do
          covered=""
          for d in $dirs; do
            case "$f" in "$d"/*) covered=1 ;; esac
          done
          [ -n "$covered" ] || keep="$keep $f"
        done
        files="$keep"
        keep=""
        for d in $dirs; do
          covered=""
          for o in $dirs; do
            [ "$d" = "$o" ] && continue
            case "$d" in "$o"/*) covered=1 ;; esac
          done
          [ -n "$covered" ] || keep="$keep $d"
        done
        dirs="$keep"
        if [ -z "$files$dirs" ]; then
          echo "no staged test files survive the filter — skipping"
        else
          par=""
          [ -n "$dirs" ] && par="-n auto"
          env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME -u XP_PERF -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID pytest $dirs $files $par -q || [ $? -eq 5 ]
        fi

# piped (NOT parallel — lefthook rejects both) runs the commands sequentially,
# in alphabetical order by name: all-tests, then perf. The scale timers are
# wall-clock bounds, so they mean nothing while all-tests' 16 xdist workers are
# saturating the box; serializing is what makes the numbers real. The name
# `all-tests` is load-bearing: `tests` would sort AFTER `perf` and silently
# invert that ordering — test_lefthook_perf_gate.py holds it as a constant and
# pins that `perf` sorts last.
#
# `all-tests` is the whole suite, which subsumes the former `integration`
# command rather than sitting beside it — keeping both would run
# tests/integration twice. It carries -u XP_PERF, which `integration` never did:
# it runs -n auto, and an exported XP_PERF=1 would arm the wall-clock bounds
# 16-wide, measuring xdist contention instead of anything real.
# No glob/{push_files} on either command: pre-push also fires from a detached
# HEAD (close_common._push_relocated), where a file-list filter can come back
# empty and silently skip the command.
# `perf` pins both a file path and a class name. Either one drifting fails LOUD
# rather than silently gating nothing: rename the class and pytest deselects
# everything (exit 5); move the file and pytest errors on the missing path
# (exit 4). Dropping XP_PERF=1 is the one drift that WOULD pass silently (every
# test skips, exit 0) — test_lefthook_perf_gate.py is the guard for that, and for
# the skipUnless staying on the class. Keep in sync with TestScaleBenchmarks in
# tests/engine/test_scale_invariants.py.
pre-push:
  piped: true
  commands:
    # -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID: the
    # hook-liveness heartbeat is keyed on the session id, so an inherited real
    # one aims the suite at the developer's own live marker.
    # tests/_env_hygiene.py pins the same chain in process; both places are
    # required and a test asserts they agree.
    all-tests:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME -u XP_PERF -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID pytest -n auto -q
    perf:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID XP_PERF=1 pytest plugins/xp-agents/tests/engine/test_scale_invariants.py -k TestScaleBenchmarks -p no:xdist -q
