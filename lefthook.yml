# piped (NOT parallel — lefthook rejects both): ruff-format rewrites staged
# files in place, so nothing else may read them concurrently. `priority: 1`
# pins it to run before the other commands regardless of name ordering
# (verified against lefthook 2.1.10: priority orders piped and plain-sequential
# runs, and is a no-op under parallel); see
# test_dev_setup.py::TestRuffFormatFixModeSequencedOutOfParallel for the pin.
#
# Two consequences of `piped` beyond the ordering, both deliberate:
#  - It ABORTS the remaining commands at the first failure. A ruff-check error
#    therefore costs 0.06s instead of the ~129s pytest run, but a red commit
#    shows only the FIRST failing check, not every one at once as parallel did.
#  - Everything is sequential now, pyright included: ~13s of type-checking that
#    used to overlap the test run is added to the hook's wall clock.
#
# Accepted residual of `stage_fixed` (see the SMM's precommit-piped-priority /
# partial-stage decisions): on a PARTIALLY staged file, ruff formats the
# working-tree copy and stage_fixed `git add`s the whole file, so unstaged
# edits in that file join the commit. Stage whole files, or re-check `git diff
# --cached` after a commit where the formatter reported a rewrite.
pre-commit:
  piped: true
  commands:
    ruff-format:
      glob: "*.py"
      priority: 1
      run: ruff format {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "*.py"
      run: ruff check {staged_files}
    shellcheck:
      glob: "*.sh"
      run: shellcheck -x -e SC1091 {staged_files}
    pyright:
      glob: "plugins/xp-agents/**/*.py"
      root: "plugins/xp-agents/"
      run: pyright
    # All tests in one pytest -n auto run (~13s on 16 cores). Replaces four
    # separate unittest discover commands; pytest-xdist parallelism is finer-
    # grained than lefthook's per-command parallelism. See README "Development
    # setup" for pipx install + pytest-xdist injection.
    # -u XP_PERF: an exported XP_PERF=1 must not re-arm the wall-clock scale
    # timers on the commit gate. They are only meaningful when they run alone,
    # which only pre-push's `piped` sequencing guarantees.
    # -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID: the
    # hook-liveness heartbeat is keyed on the session id, so an inherited real
    # one aims the suite at the developer's own live marker.
    # tests/_env_hygiene.py pins the same chain in process; both places are
    # required and a test asserts they agree.
    tests:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME -u XP_PERF -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID pytest -n auto -q

# piped (NOT parallel — lefthook rejects both) runs the commands sequentially,
# in alphabetical order by name: integration, then perf. The scale timers are
# wall-clock bounds, so they mean nothing while integration's 16 xdist workers
# are saturating the box; serializing is what makes the numbers real.
# No glob/{push_files} on either command: pre-push also fires from a detached
# HEAD (close_common._push_relocated), where a file-list filter can come back
# empty and silently skip the command.
# `perf` pins both a file path and a class name. Either one drifting fails LOUD
# rather than silently gating nothing: rename the class and pytest deselects
# everything (exit 5); move the file and pytest errors on the missing path
# (exit 4). Dropping XP_PERF=1 is the one drift that WOULD pass silently (every
# test skips, exit 0) — test_lefthook_perf_gate.py is the guard for that, and for
# the skipUnless staying on the class. Keep in sync with TestScaleBenchmarks in
# tests/engine/test_scale_invariants.py.
pre-push:
  piped: true
  commands:
    integration:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID pytest plugins/xp-agents/tests/integration -n auto -q
    perf:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_COMMON_DIR -u GIT_INDEX_FILE -u XP_TEAMMATE_NAME -u XP_SESSION_ID -u CODEX_THREAD_ID -u CLAUDE_CODE_SESSION_ID XP_PERF=1 pytest plugins/xp-agents/tests/engine/test_scale_invariants.py -k TestScaleBenchmarks -p no:xdist -q
