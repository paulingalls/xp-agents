[pytest]
# Test runner config — pytest is allowed for tests only (CLAUDE.md). Plugin
# code that ships stays stdlib-only.
#
# Why pythonpath: tests import production modules (`scripts/`, `smm/`) and
# their own helpers (`_bases`, `conftest`). unittest discovery handles this
# via per-file `sys.path.insert(...)`; pytest needs the dirs declared. The
# scaffold/ subdir carries its own `_helpers` (git/subprocess fixtures); it is
# listed so scaffold tests import it in single-file isolation, not only under
# whole-directory collection — the form the M4/M5/M6 AC gates invoke.
testpaths = plugins/xp-agents/tests
pythonpath =
    plugins/xp-agents/tests
    plugins/xp-agents/tests/scaffold
    plugins/xp-agents/scripts
    plugins/xp-agents/smm
# Match unittest's `test_*.py` discovery pattern.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
