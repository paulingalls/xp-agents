name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede, don't accumulate. A sprint branch is pushed several times while its
# PR is open and every push started another full matrix run: sprint-128 alone
# burned five runs in August, of which only the last one's answer was ever read.
#
# Pushes to main get a group of their own (run_id is unique), so they neither
# cancel nor queue behind each other. `cancel-in-progress: false` would NOT be
# enough: a run that is merely PENDING in a shared group is cancelled when a
# newer one joins it, so two merges landing inside one run's duration would
# leave the middle commit unverified — and main is the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the floor this plugin DECLARES (CLAUDE.md: "Python 3.11+"), so
        # it is the version a PR must be green on — testing only the newer one is
        # the direction that lets 3.12-only syntax reach users at the floor.
        #
        # main additionally runs 3.12, and that row is NOT a gate on anything:
        # pushing to main publishes to the marketplace, so post-merge here means
        # post-PUBLISH. A 3.12-only break is therefore detected after it ships,
        # never before. Accepted deliberately for the minutes, the gap between
        # the two versions being narrow and the shipped code stdlib-only.
        # Revisit trigger: the first 3.12-only break that reaches a release —
        # then put 3.12 back on pull_request and pay for it.
        # The two versions split August's minutes almost exactly in half
        # (502 / 530 of 1032), so dropping one from PRs halves the larger share.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.12"]') }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        # The JS suite covering plugins/xp-agents/workflows/ is driven from the
        # Python suite below, which FAILS rather than skips when node is
        # missing. The runner image ships a node, but pinning it here is the
        # difference between "the workflow script is covered on CI" and "the
        # workflow script is covered on CI until the image changes".
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ruff and pytest
        # Tests require ruff on PATH (story-007's _staged_ruff_findings
        # invokes it during commit-gate tests via lint_check.run_linter_batch).
        # Install BEFORE tests so the gate can run, not after.
        #
        # pytest is needed even though the suite below runs under unittest:
        # _codex_harness.assert_module_skips_without_harness re-runs a module
        # through `sys.executable -m pytest` to prove its harness-gated rows
        # SKIP when the harness is absent. Launched via pytest that import is
        # always satisfiable; launched via unittest it is not, so the three
        # consumers of that helper failed here while passing on every developer
        # machine. The asymmetry was invisible because the assertion reported
        # only stdout, which an interpreter that cannot import pytest leaves
        # empty — see the stderr fix in _codex_harness.py.
        run: pip install ruff pytest

      - name: Install clang-tidy and clang-format
        # tests/hooks/test_lint_polyglot.py proves the C/C++ gate against the REAL
        # binary, because a hand-written stub would only encode our own model of the
        # CLI — and the bug being fixed IS that our model was wrong.
        #
        # No `|| true`, no `continue-on-error`: a silently-failing install would turn
        # every one of those tests into a SKIP, and a skipped test is a green test.
        # The suite would then certify a C/C++ gate nobody had run.
        #
        # clang-format is a SEPARATE package, and it is not optional here: it is the
        # row C/C++ projects actually get GATED on (a repo with a .clang-format and no
        # .clang-tidy), and its tripwire proves it does NOT share clang-tidy's
        # separator bug. Leave it out and that tripwire skips — green, and proving
        # nothing, which is the exact failure this block exists to prevent.
        #
        # checkstyle is deliberately NOT installed. Java stays degraded (its exit code
        # cannot express a finding), so provisioning a JVM here would pay to prove a
        # negative; its facts are pinned locally and its tests skip.
        run: sudo apt-get update && sudo apt-get install -y clang-tidy clang-format

      - name: Run tests
        run: python3 -m unittest discover -s plugins/xp-agents/tests -p "test_*.py" -v

      - name: Lint check
        run: ruff check plugins/xp-agents/
