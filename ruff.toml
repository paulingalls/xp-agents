target-version = "py310"

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[lint.per-file-ignores]
"plugins/xp-agents/smm/test_smm.py" = ["E501"]  # allow long lines in tests
"plugins/xp-agents/smm/test_engine.py" = ["E501"]  # allow long lines in tests
