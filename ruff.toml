target-version = "py310"

# Defense-in-depth against ad-hoc `ruff format .` or `ruff format <file>`
# corrupting strict-JSON hook manifests. lefthook already restricts
# pre-commit ruff to *.py. `force-exclude` is required so the exclude
# applies even when a manifest is passed explicitly on the command line.
# The glob is deliberately wider than hooks.json: it must also cover every
# generated sibling, which nobody hand-edits and whose corruption is therefore
# the least likely to be noticed. A single **/*.json rather than a path-shaped
# pattern per manifest — force-exclude's matcher is filename-shaped, so a
# **/*-plugin/plugin.json glob would satisfy ruff while missing every other
# JSON file (marketplace catalogs, future manifests) the same way.
#
# Markdown for the same reason, different blast radius: ruff 0.16 reformats
# Python code blocks INSIDE markdown, and `ruff format .` rewrites 11 docs
# files here — prose nobody formats with ruff, and diff noise attached to
# whatever commit happened to run it. Nothing rejects the result, so unlike
# the JSON half this is untidiness rather than corruption.
extend-exclude = ["**/*.json", "**/*.md"]
force-exclude = true

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[lint.per-file-ignores]
"plugins/xp-agents/smm/test_smm.py" = ["E501"]  # allow long lines in tests
"plugins/xp-agents/smm/test_engine.py" = ["E501"]  # allow long lines in tests
