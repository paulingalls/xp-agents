target-version = "py310"

# Defense-in-depth against ad-hoc `ruff format .` or `ruff format <file>`
# corrupting strict-JSON hook manifests. lefthook already restricts
# pre-commit ruff to *.py. `force-exclude` is required so the exclude
# applies even when hooks.json is passed explicitly on the command line.
extend-exclude = ["**/hooks.json"]
force-exclude = true

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]

[lint.per-file-ignores]
"plugins/xp-agents/smm/test_smm.py" = ["E501"]  # allow long lines in tests
"plugins/xp-agents/smm/test_engine.py" = ["E501"]  # allow long lines in tests
